plugins { id 'com.android.application' }
def devAssets = providers.gradleProperty('devAssets').map { it.toBoolean() }.getOrElse(false)
def releaseDebugSigning = providers.gradleProperty('releaseDebugSigning').map { it.toBoolean() }.getOrElse(false)
def signingValues = ['RR_KEYSTORE', 'RR_KEYSTORE_PASSWORD', 'RR_KEY_ALIAS', 'RR_KEY_PASSWORD'].collectEntries { name ->
    [(name): providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()]
}
def hasReleaseKey = signingValues.values().any { it != null }
if (hasReleaseKey && signingValues.values().any { !it })
    throw new GradleException('Release signing requires RR_KEYSTORE, RR_KEYSTORE_PASSWORD, RR_KEY_ALIAS and RR_KEY_PASSWORD together.')
if (hasReleaseKey && releaseDebugSigning)
    throw new GradleException('Choose the supplied release key or releaseDebugSigning, not both.')
def tagOutput = new ByteArrayOutputStream()
def taggedVersion = '0.1-research'
def noticeDirectory = layout.buildDirectory.dir('generated/notices')
def prepareNotices = tasks.register('prepareNotices', Copy) {
    from new File(rootProject.projectDir.parentFile, 'third_party')
    include 'LICENSE', 'SDL-LICENSE.txt', 'JPEG-LICENSE.md', 'JPEG-README.ijg'
    into noticeDirectory.map { it.dir('licenses') }
}
try {
    def result = project.exec {
        workingDir rootProject.projectDir.parentFile
        commandLine 'git', 'describe', '--tags', '--abbrev=0'
        standardOutput tagOutput
        errorOutput new ByteArrayOutputStream()
        ignoreExitValue true
    }
    if (result.exitValue == 0 && tagOutput.toString('UTF-8').trim())
        taggedVersion = tagOutput.toString('UTF-8').trim().replaceFirst('^v', '')
} catch (Exception ignored) { /* Source archives need no Git executable. */ }

android {
    namespace 'org.roadrash.nativeport'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.roadrash.nativeport'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName taggedVersion
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', "-DRR_DEV_ASSETS=${devAssets ? 'ON' : 'OFF'}" } }
    }
    buildFeatures { prefab true }
    signingConfigs {
        if (hasReleaseKey) {
            ownedRelease {
                storeFile file(signingValues.RR_KEYSTORE)
                storePassword signingValues.RR_KEYSTORE_PASSWORD
                keyAlias signingValues.RR_KEY_ALIAS
                keyPassword signingValues.RR_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false // SDL's JNI entry points are reached through reflection.
            if (hasReleaseKey) signingConfig signingConfigs.ownedRelease
            else if (releaseDebugSigning) signingConfig signingConfigs.debug
        }
    }
    // Original disc data stays local and is imported at runtime. Only explicitly
    // requested developer debug builds can see the old research asset folder.
    sourceSets { main { assets.srcDirs = [noticeDirectory.get().asFile, devAssets ? 'src/main/assets' : 'src/main/empty-assets'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path '../../CMakeLists.txt'; version '3.22.1' }
    }
}
dependencies { implementation files('libs/SDL3-3.4.8.aar') }
tasks.named('preBuild').configure { dependsOn prepareNotices }

def verifyAll = tasks.register('verifyNoGameData') {
    group = 'verification'
    description = 'Check both APK variants for embedded original game data.'
}
android.applicationVariants.all { variant ->
    def capitalName = variant.name.capitalize()
    def verifier = tasks.register("verify${capitalName}NoGameData") {
        dependsOn variant.packageApplicationProvider
        doLast {
            if (devAssets && variant.buildType.name == 'debug') {
                logger.lifecycle('Developer assets enabled for debug; this APK is for local research only.')
                return
            }
            variant.outputs.each { output ->
                def apk = new File(variant.packageApplicationProvider.get().outputDirectory.get().asFile, output.outputFileName)
                if (!apk.isFile()) throw new GradleException("APK missing: ${apk}")
                def archive = new java.util.zip.ZipFile(apk)
                try {
                    if (archive.entries().find { it.name.startsWith('assets/game/') })
                        throw new GradleException("Original game data found in ${apk.name}; runtime import is required.")
                } finally { archive.close() }
            }
        }
    }
    tasks.named("assemble${capitalName}").configure { dependsOn verifier }
    verifyAll.configure { dependsOn verifier }
}
