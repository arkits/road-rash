# Plan 33b Tasks 1, 5 and 7: Windows native gate. MSVC x64 is the release
# toolchain (full build + CTest); ARM64 builds natively on the Windows ARM
# runner; clang-cl and MSYS2 clang64 are build checks that also run the unit
# tests. The package jobs build Release, test it, then build, verify and
# install-test the portable zip and per-user installer for x64 and ARM64.
# No game data on CI, so disc tests exit 77 (skipped).
name: Windows

on:
  push:
    branches: [main, 'port/plan33b-**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'oracle/**'
      - 'server/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'windows/**'
      - 'run-windows.*'
      - 'assets/app-icon/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-package.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
  PYTHONUTF8: '1' # Python tools read UTF-8 sources/docs (Windows default is the ANSI code page)

jobs:
  msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: msvc-x64, runner: windows-2022, preset: windows-msvc, arch: x64, tests: all}
          - {name: msvc-arm64, runner: windows-11-arm, preset: windows-msvc-arm64, arch: arm64, tests: all}
          - {name: clang-cl-x64, runner: windows-2022, preset: windows-clang-cl, arch: x64, tests: unit}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Locate or bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT -or -not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            git clone --quiet https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            "VCPKG_INSTALLATION_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        if: matrix.tests == 'all'
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest.xml
      - name: Only disc, fixture and host-specific tests skipped
        if: matrix.tests == 'all'
        run: python tools/ctest_skip_check.py --build-dir build-${{ matrix.preset }} -C Debug --junit build-${{ matrix.preset }}/ctest.xml
      - name: Unit tests
        if: matrix.tests == 'unit'
        run: ctest --test-dir build-${{ matrix.preset }} -C Debug -L unit --output-on-failure -j 4
      - name: Determinism (synthetic 8-human race vs the macOS reference)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter rr-determinism.exe build-${{ matrix.preset }} | Select-Object -First 1
          & $exe.FullName --synthetic > det.txt
          python -c "import sys;a=open('det.txt').read().split();b=open('tests/data/determinism_synthetic.txt').read().split();print('determinism: ${{ matrix.name }}', 'matches' if a==b else 'DIFFERS');sys.exit(a!=b)"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.name }}
          path: |
            build-${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            build-${{ matrix.preset }}/ctest.xml
          if-no-files-found: ignore

  # run-windows.bat from a plain shell: it must find Visual Studio, enter the
  # MSVC environment and vcpkg itself, build Release and launch the game.
  run-script:
    name: run-windows-script
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch with run-windows.bat
        shell: cmd
        run: |
          call run-windows.bat --console --version > version.json
          if errorlevel 1 exit /b 1
          type version.json
          python -c "import json; d = json.load(open('version.json')); assert d['configuration'] == 'Release', d"

  mingw:
    name: msys2-clang64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-openssl git
      - name: Configure
        run: cmake --preset windows-mingw
      - name: Build
        run: cmake --build build-windows-mingw --parallel
      - name: Unit tests
        run: ctest --test-dir build-windows-mingw -L unit --output-on-failure -j 4
      - name: Determinism (synthetic 8-human race vs the macOS reference)
        run: |
          build-windows-mingw/Debug/rr-determinism.exe --synthetic > det.txt 2>/dev/null || build-windows-mingw/rr-determinism.exe --synthetic > det.txt
          python -c "import sys;a=open('det.txt').read().split();b=open('tests/data/determinism_synthetic.txt').read().split();print('determinism: msys2-clang64', 'matches' if a==b else 'DIFFERS');sys.exit(a!=b)"

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: windows-2022, preset: windows-msvc}
          - {arch: arm64, runner: windows-11-arm, preset: windows-msvc-arm64}
    uses: ./.github/workflows/windows-package.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      preset: ${{ matrix.preset }}
      artifact: windows-package-${{ matrix.arch }}
    secrets: inherit
