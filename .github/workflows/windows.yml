# Plan 33b Tasks 1 and 7: Windows native gate. MSVC x64 is the release
# toolchain (full build + CTest); ARM64 builds natively on the Windows ARM
# runner; clang-cl and MSYS2 clang64 are build checks that also run the unit
# tests. No game data on CI, so disc tests exit 77 (skipped).
name: Windows

on:
  push:
    branches: [main, 'port/plan33b-**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'oracle/**'
      - 'server/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
  PYTHONUTF8: '1' # Python tools read UTF-8 sources/docs (Windows default is the ANSI code page)

jobs:
  msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: msvc-x64, runner: windows-2022, preset: windows-msvc, arch: x64, tests: all}
          - {name: msvc-arm64, runner: windows-11-arm, preset: windows-msvc-arm64, arch: arm64, tests: all}
          - {name: clang-cl-x64, runner: windows-2022, preset: windows-clang-cl, arch: x64, tests: unit}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Locate or bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT -or -not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            git clone --quiet https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            "VCPKG_INSTALLATION_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        if: matrix.tests == 'all'
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest.xml
      - name: Unit tests
        if: matrix.tests == 'unit'
        run: ctest --test-dir build-${{ matrix.preset }} -C Debug -L unit --output-on-failure -j 4
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.name }}
          path: |
            build-${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            build-${{ matrix.preset }}/ctest.xml
          if-no-files-found: ignore

  mingw:
    name: msys2-clang64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python mingw-w64-clang-x86_64-openssl git
      - name: Configure
        run: cmake --preset windows-mingw
      - name: Build
        run: cmake --build build-windows-mingw --parallel
      - name: Unit tests
        run: ctest --test-dir build-windows-mingw -L unit --output-on-failure -j 4
