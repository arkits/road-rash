# Plan 34 Task 3 Step 5: the simulation must be bit-identical on every
# platform. Each job runs rr-determinism --synthetic (a fixed 8-human race on
# a synthetic course; no game data) and compares its per-60-tick state
# hashes with tests/data/determinism_synthetic.txt (macOS reference).
name: Determinism matrix

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/determinism.cpp'
      - 'tools/determinism_matrix.sh'
      - 'tests/data/determinism_synthetic.txt'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/determinism.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl3
      - run: tools/determinism_matrix.sh macos

  linux-x86_64:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - run: apt-get update -qq && apt-get install -y -qq g++ cmake make libsdl3-dev python3 git
      - uses: actions/checkout@v4
      - name: Build and compare
        run: |
          cmake -S . -B build-det -DCMAKE_BUILD_TYPE=Release -DRR_NET_TRANSPORT=OFF -DRR_SDL_HEADLESS=ON
          cmake --build build-det --target rr-determinism --parallel
          build-det/rr-determinism --synthetic > linux-synthetic.txt
          diff linux-synthetic.txt tests/data/determinism_synthetic.txt

  wasm32-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Emscripten SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: .tools/emsdk
          key: emsdk-linux-6.0.10-v1
      - name: Install Emscripten 6.0.10
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0.10 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install 6.0.10
          .tools/emsdk/emsdk activate 6.0.10
      - name: Build and compare
        run: |
          source .tools/emsdk/emsdk_env.sh
          tools/determinism_matrix.sh wasm
