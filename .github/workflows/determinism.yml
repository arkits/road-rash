# Plan 34 Task 3 Step 5: the simulation must be bit-identical on every
# platform. Each job runs rr-determinism --synthetic (a fixed 8-human race on
# a synthetic course; no game data) and compares its per-60-tick state
# hashes with tests/data/determinism_synthetic.txt (macOS reference).
name: Determinism matrix

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/determinism.cpp'
      - 'tools/determinism_matrix.sh'
      - 'tools/determinism_matrix.py'
      - 'tests/data/determinism_synthetic.txt'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/determinism.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15 # macos-14 retires November 2, 2026 (runner-images#13518)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl3
      - run: tools/determinism_matrix.sh macos

  # Plan 33a Task 6 Step 1: GCC 14 and Clang 19 on x86-64 and ARM64.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-24.04, cc: gcc, cxx: g++, packages: g++}
          - {name: linux-x86_64-clang, runner: ubuntu-24.04, cc: clang-19, cxx: clang++-19, packages: clang-19}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, cc: gcc, cxx: g++, packages: g++}
          - {name: linux-arm64-clang, runner: ubuntu-24.04-arm, cc: clang-19, cxx: clang++-19, packages: clang-19}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ${{ matrix.packages }} cmake make python3 git
      - uses: actions/checkout@v4
      - name: Build and compare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build-det -DCMAKE_BUILD_TYPE=Release -DRR_NET_TRANSPORT=OFF -DRR_SDL_HEADLESS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build-det --target rr-determinism --parallel
          build-det/rr-determinism --synthetic > linux-synthetic.txt
          diff linux-synthetic.txt tests/data/determinism_synthetic.txt

  wasm32-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Emscripten SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: .tools/emsdk
          key: emsdk-linux-6.0.10-v1
      - name: Install Emscripten 6.0.10
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0.10 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install 6.0.10
          .tools/emsdk/emsdk activate 6.0.10
      - name: Build and compare
        run: |
          source .tools/emsdk/emsdk_env.sh
          tools/determinism_matrix.sh wasm

  # Plan 33b Task 6 Step 1: MSVC x64, clang-cl x64 and native MSVC ARM64.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, runner: windows-2022, arch: x64}
          - {target: windows-clang-cl, runner: windows-2022, arch: x64}
          - {target: windows-arm64, runner: windows-11-arm, arch: arm64}
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      RR_DET_REQUIRE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build and compare
        run: python tools/determinism_matrix.py ${{ matrix.target }}
      - name: Build log on failure
        if: failure()
        shell: pwsh
        run: Get-Content analysis/determinism/${{ matrix.target }}-build.log -Tail 80
