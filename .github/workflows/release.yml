# v* tags build every desktop package, then one job publishes them together
# (plan 33b Task 7): the macOS ARM64 app zip and, for Windows x64 and ARM64,
# the portable zip and per-user installer, all with the tag's version in the
# file name. Windows packages are signed when the owner's RR_SIGN_PFX_* secrets
# exist and unsigned otherwise. No game data is in any package. A manual run
# (workflow_dispatch) is a dry run: everything is built and checked, with
# development version names, and nothing is published.
name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS ARM64 release
    runs-on: macos-15 # macos-14 retires November 2, 2026 (runner-images#13518)
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build and verify standalone app
        run: tools/build_macos_app.sh

      - name: Name the zip after the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || version=dev-$(git rev-parse --short HEAD)
          cp "build-release/Road Rash Native.zip" "RoadRashNative-$version-macos-arm64.zip"

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: RoadRashNative-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: windows-2022, preset: windows-msvc}
          - {arch: arm64, runner: windows-11-arm, preset: windows-msvc-arm64}
    uses: ./.github/workflows/windows-package.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      preset: ${{ matrix.preset }}
      artifact: release-windows-${{ matrix.arch }}
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [macos-arm64, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check the asset set
        run: |
          ls -l dist
          for name in macos-arm64.zip windows-x64.zip windows-arm64.zip setup-x64.exe setup-arm64.exe; do
            test "$(ls dist/RoadRashNative-*-"$name" | wc -l)" -eq 1 || { echo "missing or duplicate *-$name"; exit 1; }
          done
          (cd dist && sha256sum RoadRashNative-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/RoadRashNative-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
